name: Build NAH ISO Android v1.0.4 Short Label APK
on:
  push:
    branches:
      - nah-iso15189-android-v1.0.4-short-label
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .nah-iso15189-android-v1.0.1/project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Windows-parity launcher icon
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/app-logo.png https://sachyhoc.com/wp-content/plugins/nah-iso15189-suite/assets/app-logo.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          logo=Image.open('/tmp/app-logo.png').convert('RGBA')
          logo.thumbnail((410,410), Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(512,512),'white')
          draw=ImageDraw.Draw(canvas)
          draw.rounded_rectangle((12,12,500,500),radius=82,outline='#079A4B',width=18)
          x=(512-logo.width)//2
          y=(512-logo.height)//2
          canvas.alpha_composite(logo,(x,y))
          canvas.convert('RGB').save('app/src/main/res/drawable/app_icon.png')
          PY
          test -s app/src/main/res/drawable/app_icon.png

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NAH-ISO-Android-v1.0.4-test.apk

      - name: APK SHA-256
        run: sha256sum NAH-ISO-Android-v1.0.4-test.apk > NAH-ISO-Android-v1.0.4-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAH-ISO-Android-v1.0.4-test
          path: |
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-Android-v1.0.4-test.apk
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-Android-v1.0.4-test.apk.sha256
          if-no-files-found: error
