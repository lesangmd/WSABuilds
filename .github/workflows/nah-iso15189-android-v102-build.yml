name: Build NAH ISO 15189 Android v1.0.2 Icon Parity APK
on:
  push:
    branches:
      - nah-iso15189-android-v1.0.2-icon-parity
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .nah-iso15189-android-v1.0.1/project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Windows-parity launcher icon
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/app-logo.png https://sachyhoc.com/wp-content/plugins/nah-iso15189-suite/assets/app-logo.png
          test -s /tmp/app-logo.png
          convert -size 512x512 xc:white             -fill none -stroke '#079A4B' -strokewidth 18             -draw 'roundrectangle 12,12 500,500 82,82'             /tmp/base.png
          convert /tmp/app-logo.png -resize 410x410 /tmp/logo.png
          convert /tmp/base.png /tmp/logo.png -gravity center -composite app/src/main/res/drawable/app_icon.png
          identify app/src/main/res/drawable/app_icon.png

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NAH-ISO-15189-SUITE-Android-v1.0.2-test.apk

      - name: APK SHA-256
        run: sha256sum NAH-ISO-15189-SUITE-Android-v1.0.2-test.apk > NAH-ISO-15189-SUITE-Android-v1.0.2-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAH-ISO-15189-SUITE-Android-v1.0.2-test
          path: |
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-15189-SUITE-Android-v1.0.2-test.apk
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-15189-SUITE-Android-v1.0.2-test.apk.sha256
          if-no-files-found: error
