name: Build NAH ISO 15189 Android v1.0.1 Compatibility APK
on:
  push:
    branches:
      - nah-iso15189-android-v1.0.1-compat
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .nah-iso15189-android-v1.0.1/project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build compatibility APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test.apk

      - name: APK SHA-256
        run: sha256sum NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test.apk > NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test
          path: |
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test.apk
            .nah-iso15189-android-v1.0.1/project/NAH-ISO-15189-SUITE-Android-v1.0.1-compat-test.apk.sha256
          if-no-files-found: error
